<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" fill="none">
  <!-- 3 overlapping corporate rings/nodes -->
  <g transform="translate(10, 8)">
    <!-- Red circle -->
    <ellipse cx="25" cy="20" rx="14" ry="12" fill="#E53935" opacity="0.9" />
    <!-- Dark Blue circle overlapping -->
    <ellipse cx="40" cy="20" rx="14" ry="12" fill="#1565C0" opacity="0.85" />
    <!-- Green/Teal circle overlapping -->
    <ellipse cx="55" cy="20" rx="14" ry="12" fill="#00897B" opacity="0.9" />
  </g>
  <!-- Text IndonesiaRe -->
  <text x="12" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="20" fill="#0D3B66" letter-spacing="-0.5">Indonesia<tspan font-weight="500" fill="#1E88E5">Re</tspan></text>
</svg>
